name: 'UI Suite Umami: displays'
description: 'Display Builder page layout, entity view displays and views using UI Suite daisyUI components.'
type: 'Site'
install:
  - display_builder
  - display_builder_entity_view
  - display_builder_page_layout
  - display_builder_views
  - display_builder_ui
  - ui_patterns
  - ui_patterns_field
  - ui_patterns_library
  - ui_patterns_views
  - ui_patterns_blocks
  - ui_patterns_field_formatters
  - ui_icons
  - ui_icons_patterns
  - ui_styles
  - ui_skins
  - ui_suite_daisyui
  - navigation
recipes:
  - ui_suite_umami_content_model
config:
  # Displays are meant to be edited in Display Builder after the recipe is
  # applied, so a re-apply must not fail, or overwrite, a customised display.
  strict: false
