name: 'UI Suite Umami: multilingual'
description: 'English and Spanish: language negotiation and content translation settings from the Umami demo profile.'
type: 'Site'
install:
  - language
  - locale
  - config_translation
  - content_translation
recipes:
  - ui_suite_umami_content_model
config:
  # The recipe installs language, but not the module's own default config, so
  # the locked languages (und, zxx) must be imported for Spanish to be added.
  strict:
    - language.content_settings.block_content.banner_block
    - language.content_settings.block_content.basic
    - language.content_settings.block_content.disclaimer_block
    - language.content_settings.block_content.footer_promo_block
    - language.content_settings.media.image
    - language.content_settings.node.article
    - language.content_settings.node.page
    - language.content_settings.node.recipe
    - language.content_settings.taxonomy_term.recipe_category
    - language.content_settings.taxonomy_term.tags
  import:
    language:
      - language.entity.en
      - language.entity.und
      - language.entity.zxx
      - language.mappings
  actions:
    user.role.editor:
      grantPermissions:
        - 'create content translations'
        - 'delete content translations'
        - 'translate any entity'
        - 'update content translations'
