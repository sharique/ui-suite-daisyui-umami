name: 'UI Suite Umami: content model'
description: 'Content types, fields, vocabularies, media, image styles, roles and editorial workflow ported from the Umami demo profile.'
type: 'Content type'
install:
  - node
  - taxonomy
  - block_content
  - media
  - media_library
  - menu_ui
  - menu_link_content
  - path
  - options
  - datetime
  - image
  - file
  - responsive_image
  - editor
  - ckeditor5
  - field_ui
  - views
  - views_ui
  - workflows
  - content_moderation
  - breakpoint
  - ui_patterns
  - ui_patterns_views
  - ui_suite_daisyui
  - language
  - contextual
  - navigation
config:
