    - user.role.author
    - views.view.articles_aside
    - workflows.workflow.editorial
  import:
    media_library:
      - core.entity_form_mode.media.media_library
      - core.entity_view_mode.media.media_library
      - image.style.media_library
      - views.view.media_library
    node:
      - core.entity_view_mode.node.full
      - core.entity_view_mode.node.rss
      - core.entity_view_mode.node.teaser
    image:
      - image.style.medium
      - image.style.thumbnail
    system:
      - system.menu.main
    # Recipe module installs skip navigation's two menus (core quirk), so the
    # navigation block layout would reference a missing menu.
    navigation:
      - system.menu.content
      - system.menu.navigation-user-links
  actions:
    user.role.anonymous:
      grantPermissions:
        - 'access content'
        - 'use text format restricted_html'
        - 'view media'
    user.role.authenticated:
      grantPermissions:
        - 'access content'
        - 'use text format basic_html'
        - 'view media'
